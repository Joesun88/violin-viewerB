<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joesun Violin Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}
model-viewer{width:100vw;height:100vh;background:#f5f5f5}
.panel{position:fixed;top:20px;left:20px;width:260px;max-height:90vh;overflow-y:auto;background:rgba(255,255,255,.95);padding:16px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:30}
.panel.collapsed{width:52px;height:52px;padding:0;overflow:hidden}
.toggle-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border:none;border-radius:10px;background:#222;color:#fff}
.panel.collapsed .panel-content{display:none}
.company-info{position:fixed;bottom:20px;left:28px;font-size:13px;font-weight:bold;background:#999;color:green;text-align:center}
.company-logo{position:fixed;bottom:40px;left:16px;width:12vw;max-width:100px;min-width:80px;height:auto}
</style>
</head>
<body>
<div class="panel collapsed" id="controlPanel">
<button class="toggle-btn" onclick="togglePanel()">☰</button>
<div class="panel-content">
<strong>Wood Texture</strong>
<button onclick="setWood('wood-light.jpg')">Light Wood</button>
<button onclick="setWood('wood-dark.jpg')">Dark Wood</button>
<button onclick="setWood('wood-red.jpg')">White Wood</button>
</div></div>

<model-viewer id="mv" src="Violin-v1.glb" poster="poster.webp"
ar ar-modes="webxr scene-viewer quick-look"
camera-controls autoplay
environment-image="industrial_workshop_foundry_4k.hdr"
exposure="1.35">
<button slot="ar-button">📱 AR 實境預覽</button>
</model-viewer>

<div class="company-info">Joesun Studio<br></div>
<img src="logo.png" class="company-logo">

<script>
const mv=document.querySelector("#mv");
function togglePanel(){document.querySelector("#controlPanel").classList.toggle("collapsed");}
async function setWood(textureUrl){
 const tex=await mv.createTexture(textureUrl);
 mv.model.materials.forEach(mat=>{
  if(mat.pbrMetallicRoughness.baseColorTexture){
   mat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
  }
 });
}
function startTeslaShowroom(){
 let t=0;
 function animate(){
  t+=0.5;
  const orbit=180+Math.sin(t)*15;
  const zoom=95+Math.sin(t*0.5)*8;
  mv.cameraOrbit=`${orbit}deg 75deg ${zoom}%`;
  requestAnimationFrame(animate);
 }
 animate();
}
mv.addEventListener("load",()=>{
 mv.model.materials.forEach(mat=>{
  const p=mat.pbrMetallicRoughness;
  p.setBaseColorFactor([0.42,0.43,0.46,1]);
  p.setMetallicFactor(0.82);
  p.setRoughnessFactor(0.24);
 });
 startTeslaShowroom();
});
</script>
</body></html>
